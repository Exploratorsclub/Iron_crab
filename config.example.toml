
# Allgemein
[app]
name = "ironcrab"
log_level = "info"         # trace, debug, info, warn, error
autosave_state_secs = 30

# Node / RPC
[solana]
rpc_url = "http://127.0.0.1:8899"
ws_url  = "ws://127.0.0.1:8900"
keypair_path = "~/.config/solana/id.json"  # Haupt-Wallet (Treasury)
## Adaptive RPC Parallelismus
# rpc_min_concurrency = 8
# rpc_max_concurrency = 64
# rpc_initial_concurrency = 16
# rpc_inc_every_successes = 64
# rpc_dec_on_rate_limit = 4
# rpc_timeout_ms = 10000
## WebSocket Failover & Backoff
# ws_failover_urls = ["wss://api.mainnet-beta.solana.com:8900"]
# ws_connect_timeout_ms = 8000
# ws_max_backoff_ms = 20000

# Interne Wallets / Märkte (logische Buckets für Allokation)
[[markets]]
name = "solana-arb"
allocation_pct = 60
strategy = "arb-default"    # frei definierbarer Name

[[markets]]
name = "solana-sniper"
allocation_pct = 40
strategy = "snipe-default"

# Zuweisungsstrategie Treasury → interne Wallets
[allocator]
mode = "static_pct"         # später: risk_budget, vol_target, usw.
rebalance_secs = 60
min_transfer_sol = 0.05

# Strategien (Rust)
[strategies.arb-default]
kind = "rust"
params = { max_routes = 3, min_edge_bps = 15 }

[strategies.snipe-default]
kind = "rust"
params = { max_slippage_bps = 150, max_buy_sol = 0.2 }

# Strategien (Python) – aktiviert nur wenn Feature "python"
[strategies.py-experiment]
kind = "python"
module = "strategies.sample"
class  = "SampleStrategy"
params = { threshold_bps = 20 }
