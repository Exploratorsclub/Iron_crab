# =============================================================================
# IronCrab Configuration (Multi-Process Architecture)
# =============================================================================
#
# This config is used by ALL services. Each service reads only its relevant
# sections. Copy to config.toml and adjust for your environment.
#
# Architecture (per docs/TARGET_ARCHITECTURE.md):
#   - market-data:      Geyser ingest → MarketEvents (KEYLESS)
#   - momentum-bot:     MarketEvents → TradeIntents (KEYLESS)
#   - arb-strategy:     MarketEvents → TradeIntents (KEYLESS)
#   - execution-engine: TradeIntents → Transactions (HAS KEYS)
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Application Settings
# -----------------------------------------------------------------------------
[app]
name = "ironcrab"
log_level = "info"              # trace, debug, info, warn, error
run_id_prefix = "prod"          # Prefix for run IDs (useful for log correlation)

# -----------------------------------------------------------------------------
# NATS Messaging (IPC between services)
# -----------------------------------------------------------------------------
[nats]
url = "nats://localhost:4222"
# cluster_urls = ["nats://node1:4222", "nats://node2:4222"]  # For HA setup
reconnect_delay_ms = 1000
max_reconnects = -1             # -1 = infinite

# -----------------------------------------------------------------------------
# Geyser gRPC Connection (market-data only)
# -----------------------------------------------------------------------------
[geyser]
url = "http://127.0.0.1:10000"
# x_token = "your-auth-token"   # If Geyser requires authentication
reconnect_delay_ms = 2000
# Accounts to subscribe (DEX program IDs)
subscribe_programs = [
    "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8",  # Raydium AMM V4
    "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc",  # Orca Whirlpool
    "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",  # PumpFun
]

# -----------------------------------------------------------------------------
# Solana RPC (fallback when Geyser unavailable)
# -----------------------------------------------------------------------------
[solana]
rpc_url = "http://127.0.0.1:8899"
ws_url = "ws://127.0.0.1:8900"
# Helius RPC for mint validation (local validator lacks tx history)
# helius_rpc_url = "https://mainnet.helius-rpc.com/?api-key=YOUR_KEY"

# Adaptive RPC settings
rpc_timeout_ms = 10000
rpc_max_retries = 3

# -----------------------------------------------------------------------------
# Market Data Service (market-data binary)
# -----------------------------------------------------------------------------
[market_data]
# Enable/disable DEX sources
enable_raydium = true
enable_orca = true
enable_pumpfun = true

# Rate limiting
max_events_per_sec = 10000

# Storage
log_dir = "trade_logs/market_events"
# Closed JSONL files older than this are deleted by the jsonl-writer thread (default: 24h).
# jsonl_retention_hours = 24

# Metrics
metrics_port = 9801

# -----------------------------------------------------------------------------
# Wallet Tracker (P1: Smart Money / Insider Detection)
# -----------------------------------------------------------------------------
[wallet_tracker]
enabled = true

# Known "smart money" wallets (high win rate traders)
smart_money_wallets = [
    # Add wallet addresses here
    # "ABC123...",
]

# Known bad actors (rug pullers, scammers)
bad_actor_wallets = [
    # Add wallet addresses here
]

# Early buyer detection
early_buyer_slots = 100         # Track buyers within ~40 seconds of pool creation
max_early_buyers_per_token = 50

# Whale detection
whale_threshold_lamports = 10_000_000_000  # 10 SOL

# Memory limits
max_cached_wallets = 10000

# -----------------------------------------------------------------------------
# Momentum Bot (momentum-bot binary)
# -----------------------------------------------------------------------------
[momentum]
# Policy selection
policies = ["early", "established"]  # Which policies to run

# EARLY policy: First N slots after pool creation
[momentum.early]
enabled = true
max_slots_after_creation = 50   # Only buy within first ~20 seconds
min_liquidity_sol = 5.0         # Minimum pool liquidity
max_buy_sol = 0.1               # Max SOL per trade
min_smart_money_buyers = 0      # Require N smart money wallets bought first

# ESTABLISHED policy: Momentum on existing tokens
[momentum.established]
enabled = true
min_pool_age_slots = 1000       # Pool must be older than ~7 minutes
min_volume_24h_sol = 100.0      # Minimum 24h volume
price_change_threshold_pct = 5.0  # Trigger on 5%+ price moves
max_buy_sol = 0.5

# Risk limits per token
[momentum.risk]
max_position_sol = 1.0          # Max position size per token
max_daily_loss_sol = 2.0        # Stop trading token after loss
cooldown_after_loss_secs = 300  # 5 minute cooldown after loss

# -----------------------------------------------------------------------------
# Arbitrage Strategy (arb-strategy binary)
# -----------------------------------------------------------------------------
[arb_strategy]
enabled = true
scan_interval_ms = 500          # How often to scan for opportunities

# Minimum profit thresholds
min_profit_bps = 10             # Minimum 0.1% profit to consider
min_profit_bps_to_execute = 50  # Minimum 0.5% profit to actually execute

# Position limits
max_position_lamports = 5_000_000_000  # 5 SOL max per arb

# Discovery settings
[arb_strategy.discovery]
enabled = true
mode = "full-auto"              # "discovery-only" or "full-auto"

# Base tokens for triangle arb
base_tokens = [
    "So11111111111111111111111111111111111111112",   # SOL
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
]

# Liquidity requirements
min_liquidity_sol = 20.0
min_liquidity_usd = 10000.0

# Limits
top_n_per_base = 20             # Max pairs per base token
default_scan_amount_sol = 0.05

# Cross-DEX settings
[arb_strategy.cross_dex]
enabled = true
# DEX combinations to scan
dex_pairs = [
    ["raydium", "orca"],
    ["raydium", "pumpfun"],
    ["orca", "pumpfun"],
]

# -----------------------------------------------------------------------------
# Execution Engine (execution-engine binary) - ONLY SERVICE WITH KEYS
# -----------------------------------------------------------------------------
[execution]
# Wallet configuration (ONLY execution-engine reads this!)
keypair_path = "~/.config/solana/id.json"
# Alternative: keypair_json or keypair_b64 env vars

# Dry run mode (simulate but don't send)
dry_run = true

# Simulation gate (CRITICAL: always simulate before send)
simulate_before_send = true

# Transaction settings
priority_fee_micro_lamports = 1000
max_retries = 3
confirmation_timeout_ms = 30000

# Jito bundle settings (for atomic arb execution)
[execution.jito]
enabled = false
# block_engine_url = "https://mainnet.block-engine.jito.wtf"
# tip_lamports = 10000

# Metrics
metrics_port = 9804

# -----------------------------------------------------------------------------
# Risk Management (Global)
# -----------------------------------------------------------------------------
[risk]
# Global position limits
max_total_exposure_sol = 10.0   # Max SOL across all positions
max_positions = 20              # Max concurrent positions

# Drawdown protection
max_daily_drawdown_pct = 10.0   # Stop all trading at 10% daily loss
max_position_drawdown_pct = 50.0  # Close position at 50% loss

# Cooldown after losses
cooldown_after_daily_loss_secs = 3600  # 1 hour cooldown

# Take profit tiers (optional)
# take_profit_tiers = [
#     { bps = 500, fraction = 0.3 },   # Take 30% at 5% profit
#     { bps = 1000, fraction = 0.3 },  # Take 30% at 10% profit
#     { bps = 1500, fraction = 0.4 },  # Take 40% at 15% profit
# ]

# -----------------------------------------------------------------------------
# Metrics / Monitoring
# -----------------------------------------------------------------------------
[metrics]
# Prometheus endpoints per service:
# - market-data:      :9801/metrics
# - momentum-bot:     :9802/metrics
# - arb-strategy:     :9803/metrics
# - execution-engine: :9804/metrics

# Grafana dashboards: docs/grafana_*.json

# -----------------------------------------------------------------------------
# Storage / Replay (P0: Decision Records)
# -----------------------------------------------------------------------------
[storage]
# Base directory for all logs
base_dir = "trade_logs"

# Retention
retention_days = 30
cleanup_interval_hours = 24

# Per-service subdirectories (auto-created):
# - trade_logs/market_events/     (MarketEvents JSONL)
# - trade_logs/trade_intents/     (TradeIntents JSONL)
# - trade_logs/execution_results/ (ExecutionResults JSONL)
# - trade_logs/decisions/         (Decision records for replay)

# -----------------------------------------------------------------------------
# Control Plane (FastAPI - NOT in trading hot path)
# -----------------------------------------------------------------------------
[control_plane]
host = "127.0.0.1"
port = 8080
# API key for authentication (generate with: openssl rand -hex 32)
# api_key = "your-secret-key"

# -----------------------------------------------------------------------------
# Execution Engine (execution-engine binary)
# -----------------------------------------------------------------------------
[execution_engine]
jito_enabled = true
jito_tip_lamports = 100000   # 0.0001 SOL — cross-DEX bundle min tip floor with auction math

[execution_engine.fee_policy]
default_priority_fee_micro_lamports = 100000
arb_compute_units = 400000
# Jito bundle auction budget (shared with arb-strategy pre-filter)
bundle_auction_max_spend_bps = 1500      # 15% of estimated profit cap (tip + priority)
bundle_tip_min_lamports = 100000
bundle_tip_default_bps = 1000            # 10% of profit when intent has no bundle_tip_bps
bundle_tip_max_lamports = 2000000
jito_bundle_tip_floor_lamports = 1000
# bundle_min_profit_lamports = 0         # 0 = auto from formula (min tip + assumed priority)
