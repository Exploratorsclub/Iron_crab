
# Allgemein
[app]
name = "ironcrab"
log_level = "info"         # trace, debug, info, warn, error
autosave_state_secs = 30

# Node / RPC
[solana]
rpc_url = "http://127.0.0.1:8899"
ws_url  = "ws://127.0.0.1:8900"
keypair_path = "~/.config/solana/id.json"  # Haupt-Wallet (Treasury)
## Adaptive RPC Parallelismus
# rpc_min_concurrency = 8
# rpc_max_concurrency = 64
# rpc_initial_concurrency = 16
# rpc_inc_every_successes = 64
# rpc_dec_on_rate_limit = 4
# rpc_timeout_ms = 10000
## WebSocket Failover & Backoff
# ws_failover_urls = ["wss://api.mainnet-beta.solana.com:8900"]
# ws_connect_timeout_ms = 8000
# ws_max_backoff_ms = 20000

# Interne Wallets / Märkte (logische Buckets für Allokation)
[[markets]]
name = "solana-arb"
allocation_pct = 60
strategy = "arb-default"    # frei definierbarer Name

[[markets]]
name = "solana-sniper"
allocation_pct = 40
strategy = "snipe-default"

# Zuweisungsstrategie Treasury → interne Wallets
[allocator]
mode = "static_pct"         # später: risk_budget, vol_target, usw.
rebalance_secs = 60
min_transfer_sol = 0.05

# Strategien (Rust)
[strategies.arb-default]
kind = "rust"
params = { max_routes = 3, min_edge_bps = 15 }

[strategies.snipe-default]
kind = "rust"
params = { max_slippage_bps = 150, max_buy_sol = 0.2 }

# Strategien (Python) – aktiviert nur wenn Feature "python"
[strategies.py-experiment]
kind = "python"
module = "strategies.sample"
class  = "SampleStrategy"
params = { threshold_bps = 20 }

# Sniper – minimal aktiv mit defensiven Defaults
[sniper]
max_buy_sol = 0.02
max_slippage_bps = 150
blacklist_mints = []
blacklist_owners = []
min_pool_liquidity_sol = 20.0
require_freeze_auth_none = true
require_mint_decimals_range = [0, 10]
lp_top1_max_pct = 0.60
lp_top3_max_pct = 0.80
lp_top5_max_pct = 0.90
max_position_sol = 0.10
stop_loss_bps = 3000
take_profit_bps = 1000
daily_loss_limit_sol = 0.30
max_open_positions = 3
per_mint_position_limit = 1
stop_loss_cooldown_secs = 300
rolling_pnl_window = 50
hot_reload_secs = 30
pending_trade_ttl_secs = 120
# Optional gestaffelte TPs (Beispiel, auskommentiert)
# take_profit_tiers = [ { bps = 500, fraction = 0.3 }, { bps = 1000, fraction = 0.3 }, { bps = 1500, fraction = 0.4 } ]
# trailing_stop_bps = 300
# min_exit_notional_sol = 0.02
# Data & Pricing / Adaptive Slippage
oracle_preference = "override"  # pyth|switchboard|override
# oracle_pyth_sol_usd = "..."    # Pyth price account (optional)
# oracle_switchboard_sol_usd = "..." # Switchboard aggregator (optional)
oracle_sol_usd_override = 100.0
adaptive_slippage_min_bps = 75
adaptive_slippage_max_bps = 300
adaptive_slippage_window = 20
adaptive_slippage_target_pct = 0.002
adaptive_slippage_step_bps = 5
exit_eval_interval_secs = 5
# Log Rotation & Retention
log_retention_days = 30          # Keep trade logs for 30 days (default)
log_cleanup_interval_hours = 24  # Check for old logs every 24 hours (default)
