
[package]
name = "ironcrab"
version = "0.4.0"
edition = "2021"
autobins = false

[dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

# Async & Concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
dashmap = "5"
once_cell = "1"
scopeguard = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
regex = "1"
rand = { version = "0.8", features = ["std", "small_rng"] }

# Config & Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
shellexpand = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }

# Math & time
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
bs58 = "0.5"
flate2 = "1"
csv = "1"
reqwest = { version = "0.12", features = ["json"] }
bincode = "1.3"


# ---- Solana 2.x (Agave) – EXACT pins ----
solana-sdk = "=3.0.0"
solana-client = "=3.0.0"
solana-rpc-client = "=3.0.0"
solana-transaction-status = "=3.0.0"
solana-account-decoder = "=3.0.0"
solana-program = "=3.0.0"
solana-system-program = "=3.0.0"
solana-commitment-config = "=3.0.0"
solana-address-lookup-table-interface = "=3.0.0"
solana-message = "=3.0.1"

# SPL crates (off-chain instruction builders)
solana-rpc-client-api = "=3.0.0"
spl-associated-token-account = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account-client = "2"
spl-token = { version = "8", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
notify = { version = "6", optional = true }

# NATS for IPC (required for JetStream state recovery)
async-nats = "0.46"

# UUID for run_id / intent_id generation
uuid = { version = "1", features = ["v4"] }

# Database for reserve cache persistence
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# P1: Systemd Watchdog/Notify support (Crash Isolation) - Linux only
[target.'cfg(unix)'.dependencies]
sd-notify = "0.4"

# Yellowstone Geyser gRPC client (Agave 3.0 compatible)
#
# NOTE: On Windows, building `protobuf-src` (pulled by yellowstone-grpc-proto)
# currently fails due to autotools/configure path handling. We therefore keep
# Yellowstone dependencies non-Windows only. Code that depends on Geyser has
# Windows stubs that return a clear runtime error.
#
# TPU Direct Client deps are also non-Windows (same cfg gate).
# NOTE: These crates are currently unused in Rust code — kept for future TPU sender integration.
[target.'cfg(not(windows))'.dependencies]
# Pinned after PR #732 (CompressedAccountFilterSet / cuckoo account filters). `master` head may
# require Agave 4-only workspace deps; this merge commit carries cuckoo + compatible client/proto API.
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc.git", rev = "486c2102bdf4f2e950dd04d5908388c58d5cc873" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc.git", rev = "486c2102bdf4f2e950dd04d5908388c58d5cc873" }
# Align with yellowstone-grpc-proto cuckoo helpers (`CompressedAccountFilterSet::insert` takes `solana_pubkey::Pubkey`).
solana-pubkey = "4.1.0"
# TPU Direct Client (for low-latency TX submission)
solana-tpu-client = "=3.0.0"
solana-connection-cache = "=3.0.0"
solana-quic-client = "=3.0.0"

[features]
default = []
test_helpers = []
python = ["pyo3"]
python_ipc = []
jito = []
notify_watch = ["notify"]
legacy_monolith = []
legacy_sniper = []
# Enable RPC fallback methods like refresh_pools() - DISABLED in production
# Use only for bootstrap/testing when Geyser is not available
rpc_fallback = []

[dependencies.pyo3]
version = "0.24.2"
features = ["auto-initialize"]
optional = true

[dev-dependencies]
tempfile = "3"
serial_test = "2"

[package.metadata.docs.rs]
features = ["python"]
no-default-features = true

# RUSTSEC-2026-0049 note: async-nats historically pinned 0.102.x; Solana pubsub uses vendored tungstenite where needed.
# RUSTSEC-2026-0098/0099: do not add a direct rustls-webpki pin — it conflicts with ironcrab-eval’s merged
# resolver when patched as a path/git dep; advisories are ignored in `.cargo/audit.toml` until rustls pins ≥0.103.12.
[patch.crates-io]
async-nats = { path = "vendor/async-nats" }
solana-pubsub-client = { path = "vendor/solana-pubsub-client" }
# five8 1.0.0 allows five8_core 0.1.x; Solana needs five8_core 1.x for DecodeError: Error.
five8 = { path = "vendor/five8" }

# New binaries for target architecture
[[bin]]
name = "market-data"
path = "src/bin/market_data.rs"

[[bin]]
name = "momentum-bot"
path = "src/bin/momentum_bot.rs"

[[bin]]
name = "execution-engine"
path = "src/bin/execution_engine.rs"

[[bin]]
name = "arb-strategy"
path = "src/bin/arb_strategy.rs"

[[bin]]
name = "raydium-pools"
path = "src/bin/raydium_pools.rs"

[[bin]]
name = "sell-all"
path = "src/bin/sell_all_keyless.rs"

[[bin]]
name = "latency-stress"
path = "src/bin/latency_stress.rs"

[[bin]]
name = "pump-amm-tx-probe"
path = "src/bin/pump_amm_tx_probe.rs"

[[bin]]
name = "setup-alt"
path = "src/bin/setup_alt.rs"

[[bin]]
name = "burn-manual-keyless"
path = "src/bin/burn_manual_keyless.rs"

[[bin]]
name = "manual-swap"
path = "src/bin/manual_swap.rs"

[[test]]
name = "multi_hop_sanity"
path = "tests/multi_hop_sanity.rs"
required-features = ["test_helpers"]

