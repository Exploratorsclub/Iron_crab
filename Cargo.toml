
[package]
name = "ironcrab"
version = "0.3.1-dev"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

# Async & Concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
dashmap = "5"
once_cell = "1"
scopeguard = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Yellowstone Geyser gRPC client (Agave 3.0 compatible)
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc.git", branch = "master" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc.git", branch = "master" }
regex = "1"
rand = { version = "0.8", features = ["std", "small_rng"] }

# Config & Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
shellexpand = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }

# Math & time
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
bs58 = "0.5"
flate2 = "1"
csv = "1"
reqwest = { version = "0.12", features = ["json"] }
bincode = "1.3"


# ---- Solana 2.x (Agave) – EXACT pins ----
solana-sdk = "=3.0.0"
solana-client = "=3.0.0"
solana-rpc-client = "=3.0.0"
solana-transaction-status = "=3.0.0"
solana-account-decoder = "=3.0.0"
solana-program = "=3.0.0"
solana-system-program = "=3.0.0"

# SPL crates (off-chain instruction builders)
solana-rpc-client-api = "=3.0.0"
spl-associated-token-account = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account-client = "2"
spl-token = { version = "8", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
notify = { version = "6", optional = true }

# NATS for IPC (optional for now, stub implementation without it)
async-nats = { version = "0.35", optional = true }

# UUID for run_id / intent_id generation
uuid = { version = "1", features = ["v4"] }

# Database for reserve cache persistence
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# P1: Systemd Watchdog/Notify support (Crash Isolation) - Linux only
[target.'cfg(unix)'.dependencies]
sd-notify = "0.4"

[features]
default = []
test_helpers = []
python = ["pyo3"]
python_ipc = []
jito = []
notify_watch = ["notify"]
nats = ["async-nats"]

[dependencies.pyo3]
version = "0.24.2"
features = ["auto-initialize"]
optional = true

[dev-dependencies]
tempfile = "3"
serial_test = "2"

[package.metadata.docs.rs]
features = ["python"]
no-default-features = true

# New binaries for target architecture
[[bin]]
name = "market-data"
path = "src/bin/market_data.rs"

[[bin]]
name = "momentum-bot"
path = "src/bin/momentum_bot.rs"

[[bin]]
name = "execution-engine"
path = "src/bin/execution_engine.rs"

[[bin]]
name = "arb-strategy"
path = "src/bin/arb_strategy.rs"
