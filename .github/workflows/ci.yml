name: CI

on:
  push:
    branches: [ solana3x_clean, main ]
  pull_request:
    branches: [ solana3x_clean, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (default features)
        run: cargo test --quiet

      - name: Tests (test_helpers feature)
        run: cargo test --features test_helpers --quiet

      - name: Build release
        run: cargo build --release

  python-backend:
    name: Python backend (pyo3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-py
          restore-keys: ${{ runner.os }}-cargo-

      - name: Show Python version and path
        run: |
          python --version || true
          python3 --version || true
          which python || true
          which python3 || true
          echo "pythonLocation=$PYTHONLOCATION"

      - name: Clippy (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Tests (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo test --features python --quiet
