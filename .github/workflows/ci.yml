name: CI

on:
  push:
    branches: [architecture-rebuild, architecture-rebuild-next, main, 'release/**']
  pull_request:
    branches: [architecture-rebuild, architecture-rebuild-next, main, 'release/**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Versions
        run: |
          rustc -Vv
          cargo -V
          rustfmt -V || true
          protoc --version || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (default features)
        run: cargo test --quiet

      - name: Tests (test_helpers feature)
        run: cargo test --features test_helpers --quiet

      - name: Build release
        run: cargo build --release

  eval:
    name: Eval (Level 5)
    needs: [build-test]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/architecture-rebuild' || github.ref == 'refs/heads/architecture-rebuild-next' || startsWith(github.ref, 'refs/heads/release'))) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'architecture-rebuild' || github.base_ref == 'architecture-rebuild-next' || startsWith(github.base_ref, 'release')) && github.repository == github.event.pull_request.head.repo.full_name)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout Iron_crab
        uses: actions/checkout@v4
        with:
          path: Iron_crab

      - name: Clone Iron_crab-eval
        env:
          EVAL_CLONE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/Iron_crab-eval.git
        run: |
          git clone "$EVAL_CLONE_URL" "${{ github.workspace }}/Iron_crab-eval"

      # Upstream eval may lag ironcrab API: inject_cached_amm_state gained coin_reserve/pc_reserve.
      - name: Align eval Raydium inject_cached_amm_state callsites with patched ironcrab
        run: |
          set -euo pipefail
          EVAL="${{ github.workspace }}/Iron_crab-eval"
          for f in tests/invariants_hot_path_no_rpc.rs tests/invariants_cross_dex_cold_path_reserves.rs; do
            test -f "$EVAL/$f" || continue
            perl -i -0777 -pe 's/(        9,\n        6,\n)        market_id,/${1}        None,\n        None,\n        market_id,/g' "$EVAL/$f"
          done

      # PR235: ControlResponseStatus::Busy — eval main may not list the arm yet.
      - name: Align eval ControlResponse Busy match arms with patched ironcrab IPC
        run: |
          set -euo pipefail
          EVAL="${{ github.workspace }}/Iron_crab-eval"
          for f in "$EVAL"/tests/*.rs; do
            test -f "$f" || continue
            grep -q 'ControlResponseStatus::Error' "$f" || continue
            perl -i -pe 's/(\| ControlResponseStatus::Error)( => return Ok\(\(\)\),)/$1\n                | ControlResponseStatus::Busy$2/' "$f"
            perl -i -0777 -pe 's/(\| ControlResponseStatus::Error)(\s*\n\s*\);)/$1\n                | ControlResponseStatus::Busy$2/s' "$f"
          done

      # C1b: ArbTrackActiveEntry gained `readiness` — eval main struct literals may lag wire API.
      - name: Align eval ArbTrackActiveEntry struct literals with readiness field
        run: |
          set -euo pipefail
          EVAL="${{ github.workspace }}/Iron_crab-eval"
          for f in "$EVAL"/tests/*.rs; do
            test -f "$f" || continue
            grep -q 'ArbTrackActiveEntry' "$f" || continue
            perl -i -0777 -pe '
              s{
                (\bArbTrackActiveEntry\s*\{[^\}]*?\breason\s*:\s*[^\n,]+,?)
                (\n\s*\})
              }{
                $1 =~ /readiness/ ? "$1$2" : "$1\n                readiness: ArbTrackReadiness::Warmable,$2"
              }gsex
            ' "$f"
            if grep -q 'ArbTrackReadiness::Warmable' "$f"; then
              perl -i -pe 's/(ArbTrackActiveEntry,)(?! ArbTrackReadiness)/$1 ArbTrackReadiness,/' "$f"
            fi
          done

      # Scope 1 / PR418: OrcaWhirlpoolState + MeteoraState gained account-seeded quote flags.
      - name: Align eval Orca/Meteora LivePoolCache literals with quote ownership flags
        run: |
          set -euo pipefail
          EVAL="${{ github.workspace }}/Iron_crab-eval"
          while IFS= read -r -d '' f; do
            if grep -q 'OrcaWhirlpoolState' "$f"; then
              perl -i -0777 -pe 's{(\bOrcaWhirlpoolState\s*\{.*?\btoken_b_program\s*:\s*[^\n]+)(\n\s*\})}{ ($1 =~ /whirlpool_quote_account_seeded/) ? $1.$2 : $1."\n                whirlpool_quote_account_seeded: true,".$2 }gse' "$f"
            fi
            if grep -q 'MeteoraState' "$f"; then
              perl -i -0777 -pe 's{(\bMeteoraState\s*\{.*?\breserve_y_balance\s*:\s*[^\n]+)(\n\s*\})}{ ($1 =~ /dlmm_bin_params_account_seeded/) ? $1.$2 : $1."\n                dlmm_bin_params_account_seeded: true,".$2 }gse' "$f"
            fi
          done < <(find "$EVAL/tests" -name '*.rs' -print0)

      - name: Patch eval git-dep to use PR checkout
        run: |
          cat >> "${{ github.workspace }}/Iron_crab-eval/Cargo.toml" <<'EOF'

          [patch."https://github.com/Exploratorsclub/Iron_crab.git"]
          ironcrab = { path = "../Iron_crab" }
          EOF

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/Iron_crab-eval/target
          key: ${{ runner.os }}-cargo-eval-${{ hashFiles('Iron_crab/Cargo.lock', 'Iron_crab-eval/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-eval-

      - name: Eval tests
        working-directory: ${{ github.workspace }}/Iron_crab-eval
        run: cargo test --quiet

  python-backend:
    name: Python backend (pyo3)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Setup Python
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-py
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Tests (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo test --features python --lib --tests --quiet

  security-audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

  # Cache is optional here; remove to avoid flakiness causing job failure

      # 0.21.x cannot parse CVSS 4.0 fields in newer advisory-db entries (fails before scanning).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Run cargo audit
        run: cargo audit --deny warnings