name: CI

on:
  push:
    branches: [ solana3x_clean, main ]
  pull_request:
    branches: [ solana3x_clean, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --quiet

      - name: Tests (test_helpers feature)
        run: cargo test --features test_helpers --quiet

      - name: Build release
        run: cargo build --release
