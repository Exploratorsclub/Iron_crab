name: CI

on:
  push:
    branches: [ solana3x_clean, main ]
  pull_request:
    branches: [ solana3x_clean, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (default features)
        run: cargo test --quiet

      - name: Tests (test_helpers feature)
        run: cargo test --features test_helpers --quiet

      - name: Build release
        run: cargo build --release

  python-backend:
    name: Python backend (pyo3)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-py
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (python feature)
        env:
          PYO3_PYTHON: python
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Tests (python feature)
        env:
          PYO3_PYTHON: python
        run: cargo test --features python --lib --tests --quiet
