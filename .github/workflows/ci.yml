name: CI

on:
  push:
    branches: ['*']  # Alle Branches
  pull_request:
    branches: ['*']  # Alle Branches

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Versions
        run: |
          rustc -Vv
          cargo -V
          rustfmt -V || true
          protoc --version || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (default features)
        run: cargo test --quiet

      - name: Tests (test_helpers feature)
        run: cargo test --features test_helpers --quiet

      - name: Build release
        run: cargo build --release

  eval:
    name: Eval (Level 5)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ironcrab-eval (Sibling für path = "../Iron_crab")
        env:
          # GITHUB_TOKEN: für öffentliche Repos optional, für private same-org Repos erforderlich
          EVAL_CLONE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/Iron_crab-eval.git
        run: |
          cd ..
          git clone "$EVAL_CLONE_URL" Iron_crab-eval

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Eval tests
        run: |
          cd ../Iron_crab-eval
          cargo test --quiet

  python-backend:
    name: Python backend (pyo3)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (remove large preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Setup Python
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-py
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Tests (python feature)
        env:
          PYO3_PYTHON: ${{ steps.setup-py.outputs.python-path }}
        run: cargo test --features python --lib --tests --quiet

  security-audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

  # Cache is optional here; remove to avoid flakiness causing job failure

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings