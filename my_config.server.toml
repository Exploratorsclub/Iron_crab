# IronCrab server config (Debian) — uses your provided RPC
# Adjust WS port if your validator exposes a different one.

# --- Application ---
[app]
name = "ironcrab-prod"
# Optimized logging: Global INFO, Sniper DEBUG (to see decision logic), Silence Orca/Geyser spam
log_level = "info,ironcrab::solana::sniper=debug,ironcrab::solana::dex::orca=warn,ironcrab::solana::geyser_listener=warn"
autosave_state_secs = 30

# --- Solana RPC & Keypair (Linux paths) ---
[solana]
rpc_url = "http://127.0.0.1:8899"
# The bot prefers ws_url as the primary WebSocket endpoint (then derives from rpc_url, then uses failovers).
ws_url  = "ws://127.0.0.1:8900"
# Keep the public IP as a fallback in case you run the bot off-box or need external access temporarily.
ws_failover_urls = ["ws://109.230.239.43:8900"]

# Geyser gRPC (RECOMMENDED for <10ms latency)
# Uncomment to use native Agave 3.0 Geyser instead of WebSocket
# Requires: --geyser-plugin-config flag in validator service
geyser_grpc_url = "http://127.0.0.1:10000"

# CRITICAL: Helius RPC for mint validation (full transaction index)
# Local validators do NOT have full transaction history - they return
# incorrect (too few) signatures for old tokens, causing us to buy them.
# Helius Free Tier provides accurate mint age via complete signature history.
# Get your API key at: https://www.helius.dev/
helius_rpc_url = "https://mainnet.helius-rpc.com/?api-key=YOUR_HELIUS_API_KEY"

keypair_path = "/home/ironcrab/.config/solana/id.json"  # adjust to your user/path
# Tuned concurrency & timeout for high-end validator (500GB RAM, 64 CPUs)
rpc_min_concurrency = 32        # can handle much more on local validator
rpc_max_concurrency = 96        # utilize the 64 CPU cores (1.5x oversubscribe)
rpc_initial_concurrency = 48    # start higher, we trust our own validator
rpc_inc_every_successes = 32    # ramp up faster
rpc_dec_on_rate_limit = 2       # be conservative on backoff
rpc_timeout_ms = 15000          # 15s timeout (local validator is fast)
## Some RPC/Proxies require WS subprotocol header "jsonrpc" for PubSub
ws_headers = { "Sec-WebSocket-Protocol" = "jsonrpc" }

# --- Markets (sum must be 100) ---
[[markets]]
name = "solana-arb"
allocation_pct = 60
strategy = "sample-rust"

[[markets]]
name = "solana-sniper"
allocation_pct = 40
strategy = "snipe-default"

# --- Allocator ---
[allocator]
mode = "static_pct"
rebalance_secs = 86400  # 24h = 86400s (daily rebalance)
min_transfer_sol = 0.05

# --- Strategies ---
[strategies.snipe-default]
kind = "rust"
params = { }

# (Optional reference; not used unless referenced by a market)
[strategies.sample-rust]
kind = "rust"
params = { }

# --- Sniper settings (BALANCED - catches real projects, filters obvious scams) ---
[sniper]
max_buy_sol = 0.005  # 5 millis per buy (small test size)
max_position_sol = 0.02  # 20 millis max per position
max_open_positions = 10  # 10 positions max
per_mint_position_limit = 1

daily_loss_limit_sol = 0.05  # 50 millis max loss per day (70% of capital)

max_slippage_bps = 150
adaptive_slippage_min_bps = 75
adaptive_slippage_max_bps = 300
adaptive_slippage_window = 20
adaptive_slippage_target_pct = 0.002
adaptive_slippage_step_bps = 5

# EXIT STRATEGY - MOONBAG MODE
stop_loss_bps = 1000       # -10% Initial Stop Loss (Sehr eng, siehe Erklärung)
# take_profit_bps = 2000   # DEAKTIVIERT zugunsten von Tiers
trailing_stop_bps = 1500   # 15% Trailing Stop (Sichert Gewinne ab)

# MOONBAG STRATEGY:
# 1. Bei +100% (2x): Verkaufe 50% -> Einsatz ist raus (Risk Free).
# 2. Bei +300% (4x): Verkaufe 50% der verbleibenden Position -> Gewinn sichern.
# 3. Der Rest (25% der Ursprungsgröße) läuft weiter bis zum Trailing Stop.
take_profit_tiers = [
    { bps = 10000, fraction = 0.5 },
    { bps = 30000, fraction = 0.5 }
]

stop_loss_cooldown_secs = 300

# MULTI-LAYER RUG FILTERING (ordered by importance):

## 1. LP CONCENTRATION - MOST IMPORTANT RUG INDICATOR
lp_top1_max_pct = 0.95  # Top holder max 95% (TESTING - very permissive)
# Why 95%: Catches most rugs but allows legit presales
# - >90% = almost certain rug
# - 70-85% = risky but some legit projects at launch
# - <70% = more distributed (safer)

lp_top3_max_pct = 0.93  # Top 3 holders max 93%
lp_top5_max_pct = 0.97  # Top 5 holders max 97%
# If 5 wallets control 97%+ = coordinated rug team

## 2. LIQUIDITY AMOUNT - COMMITMENT SIGNAL
min_pool_liquidity_sol = 0.01  # Minimum 0.01 SOL (~$1.40) - AGGRESSIVE TESTING MODE
# Why 0.01 SOL (AGGRESSIVE TESTING):
# - Catches more opportunities including micro-cap gems
# - Relies heavily on LP concentration + stop loss for safety
# - <0.01 SOL = absolute zero-effort scam (filtered)
# - 0.01-0.5 SOL = very risky but real launches happen here
# - >0.5 SOL = more serious (fewer false positives)
# Sweet spot for testing: 0.01 SOL to see maximum activity

## 3. TOKEN AUTHORITY CHECKS - SECONDARY INDICATORS
require_freeze_auth_none = false  # Don't require (filters too many good projects)
# Many legit projects keep freeze authority for:
# - Regulatory compliance
# - Security (freeze hacked wallets)
# - Team vesting locks
# INSTEAD: Rely on LP concentration + stop loss

require_mint_decimals_range = [6, 9]  # Standard token decimals
# Weird decimals (0-5 or >9) = red flag
# Most legit tokens: 6-9 decimals (like USDC=6, SOL=9)

## 4. FRESHNESS & DISTRIBUTION
max_holders = 20  # Max holders for new token check (filters old/established tokens)
# If a token has >20 holders, it's likely an old token or pre-distributed.
# New mints usually have 1-5 holders (Mint Auth, LP, Team).

## 5. OPTIONAL BURN CHECK - DISABLED FOR FLEXIBILITY
# lp_burned_min_pct = 0.20  # Uncomment to require 20% burned
# Trade-off: Filters some rugs BUT also filters legit new launches
# Recommendation: Keep disabled initially, enable after seeing false positives

# Enable diagnostic logging:
log_all_inits = true  # See what pools are being evaluated

blacklist_mints = []
blacklist_owners = []

exit_eval_interval_secs = 5
pending_trade_ttl_secs = 120
hot_reload_secs = 30

oracle_preference = "override"
oracle_sol_usd_override = 100.0

log_retention_days = 30
log_cleanup_interval_hours = 24

# Explizit abonnierte DEX Programme für SNIPER (Pump.fun primär, Raydium sekundär)
# ORCA REMOVED: Zu viele etablierte Tokens, kaum echte new token launches
program_ids = [
	"6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",  # Pump.fun (PRIMARY - token birth)
	"675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8",  # Raydium AMM v4 (SECONDARY - migrations)
]

# --- Arbitrage scanning with Auto-Discovery ---
[arbitrage]
interval_ms = 500  # 2 scans/sec (balanced: nicht zu aggressiv, findet trotzdem Opportunities)

# PROFIT THRESHOLDS - Muss TX Kosten + Fees überschreiten
min_profit_bps = 10  # 0.1% minimum (realistisch für Solana MEV competition)
# Rechnung: 0.1% von 0.1 SOL = 0.0001 SOL (~$0.014) profit
# TX cost: ~0.000005 SOL + priority fee 0.00001 SOL = 0.000015 SOL
# Netto: 0.0001 - 0.000015 = 0.000085 SOL (~$0.012) echten Gewinn

est_tx_cost_lamports = 15000  # ~0.000015 SOL (5k base + 10k priority realistic)
pairs = []  # ignored when discovery.mode = "full-auto"
event_driven = true  # EVENT-DRIVEN: React to Geyser pool updates

[arbitrage.execution]
max_slippage_bps = 200              # 2% Slippage (realistisch für volatile Pairs)
min_profit_bps_to_execute = 10      # MUST match min_profit_bps (0.1%)
max_position_lamports = 100000000   # 0.1 SOL (~$14) pro Trade (erlaubt sinnvolle Profits)
# Mit 3.3 SOL kannst du ~30 Trades parallel oder mehrere größere Positions
dry_run = false                     # echte Ausführung
priority_fee_micro_lamports = 10000 # 0.01 SOL priority fee (kompetitiv aber nicht übertrieben)

[arbitrage.discovery]
enable = true
mode = "full-auto"  # full-auto für aktive Discovery + Scans
log_all_inits = true     # enable to see what pools are found
base_tokens = [
	"So11111111111111111111111111111111111111112",  # SOL - Hauptpaar
	"EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",  # USDC - Liquideste Stablecoin
	"Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",  # USDT
]
# LIQUIDITÄTS-FILTER - Muss groß genug sein für 0.1 SOL Trades ohne extreme Slippage
min_liquidity_sol = 5.0   # 5 SOL = ~$700 (genug für 0.1 SOL Trade mit <2% impact)
min_liquidity_usd = 500.0  # $500 minimum (fängt auch kleinere USD-Pairs)
default_ui_amount = 0.1   # 0.1 SOL scan size (matches max_position, realistische Größe)
top_n_per_base = 100      # 100 pairs per base = 300 total pairs (mehr Opportunities)
interval_secs = 180       # 3 Minuten zwischen Pool-Discovery-Scans (spart RPC)
enable_raydium = true
enable_orca = true

# --- Orca Reserve Cache (Persistent SQLite) ---
[orca]
# Enable persistent SQLite cache for vault reserves
# Reduces RPC load and improves latency by caching balances across restarts
enable_reserve_cache = true

# Path to SQLite database (relative to working directory)
cache_path = "orca_reserves.db"

# Number of top pools to prefetch reserves for on startup
# Higher values = better cache warmth but slower startup
prefetch_top_pools = 100

# CRITICAL: Vault refresh interval (seconds)
# This was causing massive RPC load (8700 accounts every 5 seconds!)
# Set to 0 to DISABLE completely, or use higher value (30-60 recommended)
# Default: 5 (backwards compatible but heavy on RPC)
vault_refresh_interval_secs = 60  # Refresh every 60s instead of 5s (12x less RPC load)
