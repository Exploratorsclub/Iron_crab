# IronCrab server config (Debian) — uses your provided RPC
# Adjust WS port if your validator exposes a different one.

# --- Application ---
[app]
name = "ironcrab-prod"
log_level = "trace"  # maximum logging for deep diagnostics
autosave_state_secs = 30

# --- Solana RPC & Keypair (Linux paths) ---
[solana]
rpc_url = "http://127.0.0.1:8899"
# The bot prefers ws_url as the primary WebSocket endpoint (then derives from rpc_url, then uses failovers).
ws_url  = "ws://127.0.0.1:8900"
# Keep the public IP as a fallback in case you run the bot off-box or need external access temporarily.
ws_failover_urls = ["ws://109.230.239.43:8900"]
keypair_path = "/home/ironcrab/.config/solana/id.json"  # adjust to your user/path
# Tuned concurrency & timeout (heavier getProgramAccounts was timing out)
rpc_min_concurrency = 4         # lower floor
rpc_max_concurrency = 8         # further cap to reduce validator pressure
rpc_initial_concurrency = 6     # start lower
rpc_inc_every_successes = 128   # slower ramp-up
rpc_dec_on_rate_limit = 4
rpc_timeout_ms = 40000          # allow heavy program scan (40s)
## Some RPC/Proxies require WS subprotocol header "jsonrpc" for PubSub
ws_headers = { "Sec-WebSocket-Protocol" = "jsonrpc" }

# --- Markets (sum must be 100) ---
[[markets]]
name = "solana-arb"
allocation_pct = 60
strategy = "sample-rust"

[[markets]]
name = "solana-sniper"
allocation_pct = 40
strategy = "snipe-default"

# --- Allocator ---
[allocator]
mode = "static_pct"
rebalance_secs = 60
min_transfer_sol = 0.05

# --- Strategies ---
[strategies.snipe-default]
kind = "rust"
params = { }

# (Optional reference; not used unless referenced by a market)
[strategies.sample-rust]
kind = "rust"
params = { }

# --- Sniper settings (conservative) ---
[sniper]
max_buy_sol = 0.02
max_position_sol = 0.10
max_open_positions = 3
per_mint_position_limit = 1

daily_loss_limit_sol = 0.30

max_slippage_bps = 150
adaptive_slippage_min_bps = 75
adaptive_slippage_max_bps = 300
adaptive_slippage_window = 20
adaptive_slippage_target_pct = 0.002
adaptive_slippage_step_bps = 5

stop_loss_bps = 2000
take_profit_bps = 1000
stop_loss_cooldown_secs = 300

min_pool_liquidity_sol = 20.0
require_freeze_auth_none = true
require_mint_decimals_range = [0, 10]
lp_top1_max_pct = 0.60
lp_top3_max_pct = 0.80
lp_top5_max_pct = 0.90

blacklist_mints = []
blacklist_owners = []

exit_eval_interval_secs = 5
pending_trade_ttl_secs = 120
hot_reload_secs = 30

oracle_preference = "override"
oracle_sol_usd_override = 100.0

log_retention_days = 30
log_cleanup_interval_hours = 24

# Explizit abonnierte DEX Programme (Raydium AMM v4 & Orca Whirlpool)
program_ids = [
	"675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8",
	"whirLbMiicV3QDeqAD9nukHf8stYwh5GozfX6rS3SAm",
]

# --- Arbitrage scanning with Auto-Discovery ---
[arbitrage]
interval_ms = 2000
min_profit_bps = 10
est_tx_cost_lamports = 10000
pairs = []  # ignored when discovery.mode = "full-auto"

[arbitrage.discovery]
enable = true
mode = "full-auto"  # full-auto für aktive Discovery + Scans, discovery-only nur für CSV-Logs
log_all_inits = true     # enable to see what pools are found
base_tokens = [
	"So11111111111111111111111111111111111111112",  # SOL
	"EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",  # USDC
	"Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",  # USDT
]
min_liquidity_sol = 20.0
min_liquidity_usd = 10000.0
default_ui_amount = 0.05
top_n_per_base = 10
interval_secs = 120        # entlastet RPC (Raydium/Orca Scans seltener)
enable_raydium = true
enable_orca = true
